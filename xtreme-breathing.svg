<linearGradient id="beam"><stop stop-color="#fff5d8" stop-opacity="0"/><stop offset=".5" stop-color="#fff5d8" stop-opacity=".8"/><stop offset="1" stop-color="#fff5d8" stop-opacity="0"/></linearGradient>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 3h4" stroke="#2c1305" stroke-opacity=".19"/></pattern>
<filter id="shimmer" x="-10%" y="-30%" width="120%" height="160%"><feTurbulence baseFrequency=".013 .08" numOctaves="2" seed="12" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="18" xChannelSelector="R" yChannelSelector="G"/></filter>
