<style>
.pulse{opacity:.52}.flow,.ember{opacity:0}
@media (prefers-reduced-motion:no-preference){.pulse{animation:breathe 5s ease-in-out infinite}.flow{opacity:1;animation:sweep 4.5s linear infinite}.ember{animation:rise 4.9s ease-out infinite}}
@keyframes breathe{0%,100%{opacity:.26}50%{opacity:1}}
@keyframes sweep{0%{transform:translateX(-170px)}72%,100%{transform:translateX(850px)}}
@keyframes rise{0%,100%{opacity:0}27%{opacity:.88}92%,100%{transform:translateY(-46px);opacity:0}}
</style>
